[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "information-lifetime-computing"
version = "0.1.0"
description = "Digital Fate Calculus Prototype: a research prototype of the information-lifetime fate calculus (digital-only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Information-Lifetime Computing contributors" }]
keywords = ["research prototype", "compilers", "information lifetime", "reversible computing", "fate calculus"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ilc = "ilc.cli:main"
ourlang = "ilc.cli:main"   # alias for the placeholder name used in the project brief

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
